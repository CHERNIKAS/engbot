[mutmut]
# Mutation testing, scoped to the pure decision-making core: the modules that
# decide what gets taught, when it comes back and when it counts as learned.
# Those are the places where a passing test suite can still hide a wrong rule,
# and they are I/O-free, so a mutant either fails a test or proves the test
# never checked it.
#
#     .venv/bin/mutmut run
#     .venv/bin/mutmut results
# mutmut runs the suite from a copy of the tree, so the whole package has to be
# there for the tests to import — but only the decision-making core is worth
# mutating. Everything outside app/domain is copied and left alone.
source_paths = app
tests_dir = tests
do_not_mutate =
    app/bot/**
    app/services/**
    app/infrastructure/**
    app/config.py
    app/logging_setup.py
    app/main.py
# The generation scripts are imported by their own tests.
also_copy =
    scripts
