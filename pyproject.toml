[project]
name = "englshbot"
version = "0.1.0"
description = "Telegram bot for learning English words — personal vocabulary + spaced repetition."
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "SQLAlchemy[asyncio]>=2.0.34",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "orjson>=3.10",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  # Already present via aiogram; declared explicitly because level_tagger
  # calls the Gemini API with it directly.
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.14",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
