services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: englsh
      POSTGRES_PASSWORD: englsh
      POSTGRES_DB: englsh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englsh -d englsh"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec python -m app.main"]
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
